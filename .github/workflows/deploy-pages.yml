name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if:` conditions,
      # so expose the secret as an env var and check that instead.
      SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Pages payload
        run: |
          touch dist/.nojekyll

      # Project pages (old URL) — keep updated for now
      - name: Deploy to mobileTelePromp gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false

      # Root user site (https://dubeyaditya29.github.io/)
      # Requires repo dubeyaditya29/dubeyaditya29.github.io + secret SITE_DEPLOY_TOKEN (PAT with repo scope)
      - name: Deploy to user site root
        if: ${{ env.SITE_DEPLOY_TOKEN != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: dubeyaditya29/dubeyaditya29.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
